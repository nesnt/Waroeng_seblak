name: Build iOS App (Waroeng Seblak 48)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ws-ios-48/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Active Directory
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ws-ios-48/package-lock.json'

      - name: Install Dependencies
        run: |
          cd ws-ios-48
          npm ci

      - name: Build Web Assets
        run: |
          cd ws-ios-48
          npm run build

      - name: Capacitor Sync iOS
        run: |
          cd ws-ios-48
          npx cap sync ios --verbose

      - name: Resolve SPM Dependencies
        run: |
          cd ws-ios-48/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build iOS Archive with Xcode
        run: |
          cd ws-ios-48/ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App (.ipa)
        run: |
          cd ws-ios-48/ios/App/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../../../WaroengSeblak48.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaroengSeblak48-iOS-App
          path: ws-ios-48/WaroengSeblak48.ipa
          retention-days: 14
