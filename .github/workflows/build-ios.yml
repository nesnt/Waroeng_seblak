name: Build iOS App (Waroeng Seblak 48)
# Trigger build with live Supabase database secrets

on:
  workflow_dispatch:
  push:
    paths:
      - 'ws-ios-48/**'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Toolchain
        run: |
          echo "Active Xcode developer directory:"
          xcode-select -p
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ws-ios-48/package-lock.json'

      - name: Install Dependencies
        run: |
          cd ws-ios-48
          npm ci

      - name: Build Web Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cd ws-ios-48
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          npm run build

      - name: Capacitor Copy & Sync iOS Assets
        run: |
          cd ws-ios-48
          npx cap copy ios
          npx cap update ios || true

      - name: Build iOS Binary (.app)
        run: |
          cd ws-ios-48/ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Package App (.ipa)
        run: |
          cd ws-ios-48/ios/App
          APP_PATH=$(find ./build/DerivedData -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr ../../WaroengSeblak48.ipa Payload/
          ls -lh ../../WaroengSeblak48.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaroengSeblak48-iOS-App
          path: ws-ios-48/WaroengSeblak48.ipa
          retention-days: 14
